# Every pipeline parameter lives here. Nothing is hard-coded in src/.
project:
  seed: 42

paths:
  raw: data/raw            # cached EDGAR downloads, byte-for-byte
  interim: data/interim    # parsed tables (Parquet)
  processed: data/processed
  results: results
  report: REPORT.md        # written by `make report` from results/

edgar:
  # SEC requires "Name email" in the User-Agent. Set your own here or via the
  # SEC_USER_AGENT environment variable (the env var wins).
  user_agent: "secsignals-research your-name your-email@example.com"
  archives_url: https://www.sec.gov/Archives
  max_requests_per_second: 8     # SEC limit is 10; stay under it
  max_retries: 5
  backoff_seconds: 2.0           # doubled on each retry
  timeout_seconds: 60
  workers: 8                     # concurrent downloads; all share one rate limiter (8 req/s)
  forms: ["10-K"]                # amendments (10-K/A) are excluded on purpose
  index_start_year: 2011         # one year early: 2012 signals compare with 2011 10-Ks
  index_end_year: 2025

sections:
  name: mda                      # Item 7, Management's Discussion and Analysis
  min_words: 250                 # shorter extractions are logged as failures
  max_heading_chars: 200         # lines longer than this are prose, not headings
  workers: 8                     # parallel processes for HTML parsing

sample:                          # MD&A extraction quality check
  # "universe": S&P 500 10-Ks (needs `make universe`); "all": every 10-K filer,
  # including asset-backed trusts that legally have no MD&A.
  population: universe
  size: 200
  start_year: 2020
  end_year: 2025
  min_success_rate: 0.90

universe:
  # Historical S&P 500 membership, pinned to a commit so reruns see identical data.
  membership_url: "https://raw.githubusercontent.com/fja05680/sp500/a2430f2af0c79ddf0748e91de11bdeb1616ab5a7/S%26P%20500%20Historical%20Components%20%26%20Changes%20(Updated).csv"
  # Wikipedia revision of 2025-12-23: current members with CIKs + the change log
  # (later revisions dropped the change log). Used only to put names to old tickers.
  wikipedia_url: "https://en.wikipedia.org/w/index.php?title=List_of_S%26P_500_companies&oldid=1329075976"
  sec_tickers_url: https://www.sec.gov/files/company_tickers.json
  overrides: reference/ticker_overrides.csv    # hand-checked ticker -> CIK rows
  start: 2012-01-01
  end: 2025-12-31
  llm_start: 2020-01-01                        # coverage is also reported for the LLM period
  match_window_days: 400                       # a matched CIK must file a 10-K this close to membership

market:
  price_source: yfinance                       # swap for a CRSP loader later
  price_start: 2011-12-01
  price_end: 2026-03-31                        # leaves room for returns after late-2025 filings
  calendar_symbol: SPY                         # its trading days define the market calendar
  download_batch_size: 50
  pause_seconds: 2.0
  forward_horizon_days: 21
  max_entry_lag_days: 7                        # no trade if the stock was not trading near the signal
  market_close: "16:00"                        # US Eastern
  coverage_warn_below: 0.95

dictionary:
  # Loughran-McDonald Master Dictionary (1993-2025 edition, updated March 2026), from
  # https://sraf.nd.edu/loughranmcdonald-master-dictionary/ . Free for academic use; it is
  # downloaded, not committed. The checksum pins the exact file.
  url: "https://drive.usercontent.google.com/download?id=1iq2RUf8qGFEAk1g8wQntP3habOnR3fXF&export=download&confirm=t"
  sha256: e2d1328682bab7d2187684fb9f5420bb730401c9eefc00daf835edd203f4859d
  categories: [negative, uncertainty]
  point_in_time: true            # score each pair with the word list in force at the later filing

signals:
  min_gap_days: 270              # previous 10-K must be at least this much older...
  max_gap_days: 550              # ...and at most this much (else no comparison)
  max_length_ratio: 3            # drop pairs whose MD&A lengths differ >3x (extraction mismatch)
  min_coverage: 0.80             # share of universe 10-Ks that must get a signal

factors:
  # Ken French Data Library (revised monthly; the cached file's CRSP vintage is reported).
  five_factor_url: https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/ftp/F-F_Research_Data_5_Factors_2x3_CSV.zip
  momentum_url: https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/ftp/F-F_Momentum_Factor_CSV.zip

backtest:
  start: 2012-01-01              # first rebalance month
  end: 2025-12-31                # last rebalance month (held into January 2026)
  quantiles: 5
  signal_max_age_days: 365       # a 10-K's signal stays valid for up to 12 months
  cost_bps_per_side: 10
  min_stocks: 100                # skip months with fewer scored stocks (early 2012)
  newey_west_lags: null          # null: floor(4 * (T/100)^(2/9))
  noise_seeds: 20                # random-signal sanity check: number of draws
  signals:
    lm_change:
      file: signals_lm.parquet
      column: lm_change
      sign: -1                   # language more negative/uncertain than last year -> expect underperformance
    llm_change:
      file: signals_llm.parquet
      column: llm_change
      sign: -1                   # language more pessimistic than last year -> expect underperformance

llm:
  backend: mlx                   # mlx (local Apple silicon) | openai_compatible (e.g. vLLM on a GPU)
  model: mlx-community/Llama-3.2-3B-Instruct-8bit        # Llama 3.2 3B Instruct, 8-bit MLX weights (fits a laptop; ~2 s/filing)
  model_revision: ff054899609078569493def2823f9acd2780c0c9
  training_cutoff: 2023-12-31    # Meta's stated knowledge cutoff: filings from 2024 are the clean test
  base_url: null                 # openai_compatible only, e.g. http://gpu-host:8000/v1
  served_model_name: null        # openai_compatible only
  tokenizer_repo: meta-llama/Llama-3.2-3B-Instruct      # openai_compatible only
  prompt_version: v1             # bump whenever the prompt text changes (it is in the cache key)
  excerpt_tokens: 500            # forward-looking text sent per filing
  min_forward_tokens: 200        # below this, fall back to the section's opening
  max_new_tokens: 60             # three numbers in JSON need ~30 tokens
  max_new_tokens_justify: 160
  max_retries: 1                 # corrective follow-ups after an invalid reply
  start: 2020-01-01              # LLM signal period (filings accepted in [start, end])
  end: 2025-12-31
  justification_sample: 200      # filings scored with a written justification for hand checks
  min_valid_share: 0.95

robustness:                      # variations of the baseline backtest, each logged as a trial
  signals: [lm_change, llm_change]
  costs_bps: [0, 25]             # besides the baseline's cost_bps_per_side
  horizon_months: 3              # holding period of the longer-horizon variant
  subperiods:                    # rebalance dates in each window
    - [2020-01-01, 2021-12-31]
    - [2022-01-01, 2023-12-31]
  size_max_age_days: 550         # public float older than this gives no value weight

memorization:                    # does the model score better when it can tell who and when?
  anonymizer_version: 1          # bump whenever the masking rules change (it is in the cache key)
  pre_cutoff_sample: 500         # random pre-cutoff filings rescored anonymized (all post-cutoff ones are)
  ner_model: en_core_web_sm      # spaCy named-entity model for people, products, organizations
  spot_check: 30                 # filings written side by side for a manual anonymization check
  min_stocks: 30                 # the pre-cutoff sample holds ~100 stocks a month, not ~450
  bootstrap: 2000                # resamples for the confidence interval of IC differences
