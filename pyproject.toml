[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secsignals"
version = "0.1.0"
description = "LLM-derived signals from SEC filings"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "yfinance>=0.2.50",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
# LLM scoring: local inference on Apple silicon (mlx-lm), or any OpenAI-compatible
# server (transformers only supplies the tokenizer for counting excerpt tokens).
llm = [
    "mlx-lm>=0.32; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "transformers>=4.44",
]

[tool.hatch.build.targets.wheel]
packages = ["src/secsignals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
